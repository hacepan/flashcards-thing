<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 220" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" rx="8"/>
  
  <!-- Edges -->
  <line x1="225" y1="45" x2="135" y2="105" stroke="#000000" stroke-width="1.5"/>
  <line x1="225" y1="45" x2="315" y2="105" stroke="#000000" stroke-width="1.5"/>
  
  <line x1="135" y1="105" x2="90" y2="165" stroke="#71717a" stroke-width="1.5"/>
  <line x1="135" y1="105" x2="180" y2="165" stroke="#71717a" stroke-width="1.5"/>

  <line x1="315" y1="105" x2="270" y2="165" stroke="#71717a" stroke-width="1.5"/>
  <line x1="315" y1="105" x2="360" y2="165" stroke="#71717a" stroke-width="1.5"/>

  <!-- Root Node -->
  <circle cx="225" cy="45" r="20" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/>
  <text x="225" y="50" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Raíz</text>

  <!-- Level 1 Nodes -->
  <circle cx="135" cy="105" r="18" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <text x="135" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">B</text>

  <circle cx="315" cy="105" r="18" fill="#000000" stroke="#000000" stroke-width="1.5"/>
  <text x="315" y="110" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>

  <!-- Level 2 Nodes (Leaves) -->
  <circle cx="90" cy="165" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="90" y="169" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7c3aed" text-anchor="middle">D</text>

  <circle cx="180" cy="165" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="180" y="169" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7c3aed" text-anchor="middle">E</text>

  <circle cx="270" cy="165" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="270" y="169" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7c3aed" text-anchor="middle">F</text>

  <circle cx="360" cy="165" r="16" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="360" y="169" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#7c3aed" text-anchor="middle">G</text>

  <text x="225" y="206" font-family="system-ui, sans-serif" font-size="11" fill="#71717a" text-anchor="middle">Árbol binario: cada nodo tiene como máximo dos hijos</text>
</svg>
