<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <marker id="arrow-white" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" rx="8"/>
  
  <!-- Input Arrow -->
  <line x1="40" y1="100" x2="150" y2="100" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-white)"/>
  <text x="95" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Entradas (X)</text>

  <!-- White Box Transparent/Visible -->
  <rect x="160" y="40" width="180" height="120" rx="8" fill="#fafafa" stroke="#000000" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="250" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#7c3aed" letter-spacing="1" text-anchor="middle">CAJA BLANCA</text>
  
  <!-- Internal Process visible -->
  <rect x="180" y="85" width="60" height="38" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="210" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">Paso A</text>
  
  <line x1="240" y1="104" x2="255" y2="104" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-white)"/>
  
  <rect x="260" y="85" width="60" height="38" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="290" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#000000" text-anchor="middle">Paso B</text>

  <!-- Output Arrow -->
  <line x1="350" y1="100" x2="450" y2="100" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-white)"/>
  <text x="400" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Salidas (Y)</text>

  <text x="250" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#71717a" text-anchor="middle">Estructura interna y transformación completamente visibles</text>
</svg>
