<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" stroke="#e4e4e7" stroke-width="1" rx="8"/>
  
  <!-- Input Arrow -->
  <line x1="40" y1="100" x2="160" y2="100" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="100" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Entradas (X)</text>

  <!-- Black Box -->
  <rect x="170" y="45" width="160" height="110" rx="8" fill="#000000" stroke="#000000" stroke-width="1"/>
  <text x="250" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#ffffff" letter-spacing="1" text-anchor="middle">CAJA NEGRA</text>
  <text x="250" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#7c3aed" text-anchor="middle">?</text>

  <!-- Output Arrow -->
  <line x1="340" y1="100" x2="450" y2="100" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="395" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#000000" text-anchor="middle">Salidas (Y)</text>

  <text x="250" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#71717a" text-anchor="middle">Proceso interno desconocido (solo se observan entradas y salidas)</text>
</svg>
